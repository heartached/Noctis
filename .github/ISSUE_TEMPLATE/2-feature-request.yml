name: Feature request
description: An idea for something new, or a better way to do something.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or annoying today?
      placeholder: I have 40 playlists and no way to group them.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like Noctis to do?
      placeholder: Let me drag playlists into folders in the sidebar.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Desktop or phone?
      options:
        - Desktop app
        - Phone app (Android)
        - Both

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, screenshots, or another app that does it well.
