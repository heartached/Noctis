name: Bug report (desktop)
description: Something is broken or crashes in Noctis on Windows, macOS or Linux.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead. Screenshots help, drag them in.
      placeholder: Playback stops after the first song when crossfade is on.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The clicks, in order, if you know them.
      placeholder: |
        1.
        2.
        3.

  - type: input
    id: version
    attributes:
      label: Noctis version
      description: Settings › About. Click the version to copy it with your system info.
      placeholder: "1.6.9"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x64)
        - Linux (ARM64)
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - Installer (Setup.exe)
        - winget
        - Scoop
        - Portable zip
        - .dmg
        - AppImage
        - .deb
        - .tar.gz
        - Built from source

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      multiple: true
      options:
        - Playback / audio
        - Library / import
        - Lyrics
        - Artwork / metadata
        - Playlists / queue
        - Mini player / island
        - Settings / themes
        - Discord / Last.fm / integrations
        - Noctis Server / streaming
        - Plugins
        - Startup / crash
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings › Advanced › Developer Mode › Copy Logs, then paste here. After a crash, Open Folder there shows `crash.log`.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this isn't a duplicate.
          required: true
