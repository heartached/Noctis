name: Update package managers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.1.4). Defaults to the latest release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve version and checksums
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      zip_url: ${{ steps.v.outputs.zip_url }}
      zip_sha256: ${{ steps.v.outputs.zip_sha256 }}
      setup_url: ${{ steps.v.outputs.setup_url }}
      setup_sha256: ${{ steps.v.outputs.setup_sha256 }}
    steps:
      - name: Determine tag
        id: tag
        env:
          # Untrusted-ish inputs reach the script through the environment rather than by
          # ${{ }} text substitution: expressions are pasted into the script *before* bash
          # parses it, so a tag name or dispatch input containing shell metacharacters
          # would execute in a workflow whose downstream jobs hold SCOOP_BUCKET_TOKEN and
          # WINGET_PAT. This is the standard GitHub-documented injection sink.
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve URLs and checksums
        id: v
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          ZIP_URL="https://github.com/$REPO/releases/download/$TAG/Noctis-windows-x64.zip"
          SETUP_URL="https://github.com/$REPO/releases/download/$TAG/Noctis-v$VERSION-Setup.exe"
          curl -fsSL -o noctis-win.zip "$ZIP_URL"
          curl -fsSL -o noctis-setup.exe "$SETUP_URL"
          ZIP_SHA=$(sha256sum noctis-win.zip | cut -d' ' -f1)
          SETUP_SHA=$(sha256sum noctis-setup.exe | cut -d' ' -f1)
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "zip_url=$ZIP_URL"
            echo "zip_sha256=$ZIP_SHA"
            echo "setup_url=$SETUP_URL"
            echo "setup_sha256=$SETUP_SHA"
          } >> "$GITHUB_OUTPUT"

  scoop:
    name: Update Scoop bucket
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Noctis (for the manifest template)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout scoop-bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heartached/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Render and write manifest
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          ZIP_URL="${{ needs.resolve.outputs.zip_url }}"
          ZIP_SHA="${{ needs.resolve.outputs.zip_sha256 }}"
          mkdir -p scoop-bucket/bucket
          jq \
            --arg version "$VERSION" \
            --arg url "$ZIP_URL" \
            --arg hash "$ZIP_SHA" \
            '.version=$version | .architecture."64bit".url=$url | .architecture."64bit".hash=$hash' \
            packaging/scoop/noctis.json > scoop-bucket/bucket/noctis.json

      - name: Commit and push
        run: |
          set -euo pipefail
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/noctis.json
          if git diff --cached --quiet -- bucket/noctis.json; then
            echo "No change to noctis.json; skipping."
            exit 0
          fi
          git commit -m "noctis: update to ${{ needs.resolve.outputs.version }}"
          git push

  winget:
    name: Submit winget PR
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Install komac
        env:
          KOMAC_VERSION: "2.16.0"
          # This binary is executed in a job that holds WINGET_PAT, so a replaced upstream
          # asset would be arbitrary code execution against a token that can push to the
          # scoop bucket and open PRs on microsoft/winget-pkgs. Every other download in the
          # release path (ffmpeg, appimagetool) is pinned AND hash-verified; this one is
          # now too. Bumping KOMAC_VERSION means recomputing this:
          #   curl -fsSL https://github.com/russellbanks/Komac/releases/download/v<ver>/komac-<ver>-x86_64-unknown-linux-gnu.tar.gz | sha256sum
          KOMAC_SHA256: "7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d"
        run: |
          set -euo pipefail
          curl -fsSL -o komac.tar.gz "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${KOMAC_SHA256}  komac.tar.gz" | sha256sum -c -
          tar -xzf komac.tar.gz
          sudo install -m755 komac /usr/local/bin/komac
          komac --version

      - name: Update or create heartached.Noctis
        env:
          # Passed through the environment, not interpolated into the script body.
          # ${{ }} substitution happens before bash sees the text, so a tag name or
          # dispatch input containing shell metacharacters would execute here — in a job
          # holding WINGET_PAT. The token likewise moves out of the curl argument list,
          # where it was visible in the runner's process table.
          VERSION: ${{ needs.resolve.outputs.version }}
          URL: ${{ needs.resolve.outputs.setup_url }}
          GITHUB_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          set -euo pipefail
          if curl -fsSL -o /dev/null \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/h/heartached/Noctis"; then
            echo "heartached.Noctis already in winget-pkgs — updating."
            komac update heartached.Noctis --version "$VERSION" --urls "$URL" --submit
          else
            echo "heartached.Noctis not in winget-pkgs yet — submitting initial manifest."
            komac new heartached.Noctis --version "$VERSION" --urls "$URL" --submit
          fi
