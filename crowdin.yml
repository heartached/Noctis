# Keep the src/... path on Crowdin; without this the CLI uploads a flat Strings.resx at the branch root.
preserve_hierarchy: true
files:
  - source: /src/Noctis.UI/Localization/Strings.resx
    translation: /src/Noctis.UI/Localization/Strings.%locale%.resx
    # Plain codes match the existing Strings.es.resx and .NET's neutral cultures;
    # Chinese keeps its script so Simplified and Traditional stay separate files.
    languages_mapping:
      locale:
        de-DE: de
        es-ES: es
        fr: fr
        ja: ja
        ko: ko
        ar: ar
        ru: ru
        tr: tr
        zh-CN: zh-Hans
        zh-TW: zh-Hant
